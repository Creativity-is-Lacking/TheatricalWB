architectury {
  common(enabled_platforms.split(","))
}

loom {
  accessWidenerPath = file("src/main/resources/theatricalwb.accesswidener")
}

dependencies {
  modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
  modImplementation("com.tterrag.registrate_fabric:Registrate:${registrate_fabric_version}")
  annotationProcessor(implementation("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))

  modImplementation("dev.imabad:Theatrical:${theatrical_version}")
  modImplementation("maven.modrinth:theatrical-extra-lights:${extra_lights_fabric_version}")

  modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
}

sourceSets {
  main {
    resources.srcDir file("src/generated/resources")
  }
}
